name: citest

on:
  push:
    branches:
      - master
      - "release/**"
    paths-ignore:
      - "setup.*"
      - "requirements.txt"
      - "requirements/**"
      - "docs/**"
      - "tools/**"
      - "README.md"
      - "README_*.md"
      - "NOTICE"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/publish.yaml"

  pull_request:
    paths-ignore:
      - "setup.*"
      - "requirements.txt"
      - "requirements/**"
      - "docs/**"
      - "tools/**"
      - "README.md"
      - "README_*.md"
      - "NOTICE"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/publish.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    # The type of runner that the job will run on
    runs-on: [self-hosted]
    timeout-minutes: 240
    env:
      CI_CHECKOUT_PATH: .citest-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_CONFIG_PARAMETERS: "'core.hooksPath='"
        run: |
          set -euo pipefail
          mkdir -- "$CI_CHECKOUT_PATH"
          cd "$CI_CHECKOUT_PATH"
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fetch_options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            fetch_options+=(--depth=2)
          fi
          git fetch --no-tags "${fetch_options[@]}" origin "$GITHUB_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$GITHUB_SHA"
      - name: Get changed files
        id: changed-files
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                echo "PR_CHANGED_FILES=$(git diff --name-only -r HEAD^1 HEAD | xargs)" >> "$GITHUB_ENV"
            else
                echo "PR_CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | xargs)" >> "$GITHUB_ENV"
            fi
      - name: Checkout LFS objects
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          if ! git lfs version; then
            case "$(uname -m)" in
              x86_64)
                architecture=amd64
                digest=e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
                ;;
              aarch64)
                architecture=arm64
                digest=ac9c8efac980bb0505ead384d087e2acb6486fd8498691a2165fa174ec6118c2
                ;;
              *) echo "Unsupported Git LFS host architecture" >&2; exit 1 ;;
            esac
            tool_dir="$(mktemp -d "${RUNNER_TEMP:?}/git-lfs.XXXXXX")"
            trap 'rm -rf -- "${tool_dir:?}"' EXIT
            archive="$tool_dir/git-lfs.tar.gz"
            curl --fail --location --retry 3 \
              "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-$architecture-v3.8.0.tar.gz" \
              --output "$archive"
            echo "$digest  $archive" | sha256sum --check -
            tar -xzf "$archive" -C "$tool_dir" --strip-components=1 git-lfs-3.8.0/git-lfs
            export PATH="$tool_dir:$PATH"
            git lfs version
          fi
          git lfs fetch origin "$GITHUB_SHA"
          git lfs checkout
      - name: Run unittest
        shell: bash
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -e
          source /mnt/modelscope/ci_env.sh
          bash .dev_scripts/dockerci.sh
      - name: Remove this run's checkout
        if: always()
        shell: bash
        run: rm -rf -- "${GITHUB_WORKSPACE:?}/${CI_CHECKOUT_PATH:?}"
