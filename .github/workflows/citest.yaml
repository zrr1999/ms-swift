name: citest

on:
  push:
    branches:
      - master
      - "release/**"
    paths-ignore:
      - "setup.*"
      - "requirements.txt"
      - "requirements/**"
      - "docs/**"
      - "tools/**"
      - "README.md"
      - "README_*.md"
      - "NOTICE"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/publish.yaml"

  pull_request:
    paths-ignore:
      - "setup.*"
      - "requirements.txt"
      - "requirements/**"
      - "docs/**"
      - "tools/**"
      - "README.md"
      - "README_*.md"
      - "NOTICE"
      - ".github/workflows/lint.yaml"
      - ".github/workflows/publish.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    # The type of runner that the job will run on
    runs-on: [self-hosted]
    timeout-minutes: 240
    env:
      CI_CHECKOUT_PATH: .citest-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        env:
          GIT_CONFIG_PARAMETERS: "'core.hooksPath='"
        with:
            path: ${{ env.CI_CHECKOUT_PATH }}
            persist-credentials: false
            lfs: 'true'
            submodules: 'false'
            fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Get changed files
        id: changed-files
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                echo "PR_CHANGED_FILES=$(git diff --name-only -r HEAD^1 HEAD | xargs)" >> "$GITHUB_ENV"
            else
                echo "PR_CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | xargs)" >> "$GITHUB_ENV"
            fi
      - name: Checkout LFS objects
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: git lfs checkout
      - name: Run unittest
        shell: bash
        working-directory: ${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -e
          source /mnt/modelscope/ci_env.sh
          bash .dev_scripts/dockerci.sh
      - name: Remove this run's checkout
        if: always()
        shell: bash
        run: rm -rf -- "${GITHUB_WORKSPACE:?}/${CI_CHECKOUT_PATH:?}"
