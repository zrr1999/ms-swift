name: Alignment Model Accuracy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      paddlefleet_mode:
        description: "develop keeps the historical CodeSync tarball. stack-paired fail-closed SHA check."
        type: choice
        default: develop
        options: [develop, stack-paired]
      paddlefleet_pin_sha:
        description: "40-hex PaddleFleet commit (required for stack-paired)"
        required: false
        type: string
      paddlefleet_git_url:
        description: "Git URL that contains paddlefleet_pin_sha"
        required: false
        type: string
      paddlefleet_wheel_url:
        description: "Optional wheel URL from Build Fleet whl / Actions artifact metadata"
        required: false
        type: string
      paddlefleet_wheel_sha256:
        description: "sha256 for paddlefleet_wheel_url"
        required: false
        type: string
      paddlefleet_ops_wheel_url:
        description: "Optional paddlefleet_ops wheel URL"
        required: false
        type: string
      paddlefleet_ops_wheel_sha256:
        description: "sha256 for paddlefleet_ops_wheel_url"
        required: false
        type: string

concurrency:
  group: Alignment-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_ID: ${{ github.event.pull_request.number }}
  work_dir: ${{ github.workspace }}
  python_version: 3.12
  TASK: MS-SWIFT-${{ github.sha }}-alignment
  CE_name: alignment-ms-swift
  no_proxy: "localhost,bj.bcebos.com,su.bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  # pull_request stays on historical develop. stack-paired is workflow_dispatch only.
  ALIGNMENT_PADDLEFLEET_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.paddlefleet_mode || 'develop' }}
  PADDLEFLEET_PIN_SHA: ${{ github.event.inputs.paddlefleet_pin_sha }}
  PADDLEFLEET_GIT_URL: ${{ github.event.inputs.paddlefleet_git_url }}
  PADDLEFLEET_WHEEL_URL: ${{ github.event.inputs.paddlefleet_wheel_url }}
  PADDLEFLEET_WHEEL_SHA256: ${{ github.event.inputs.paddlefleet_wheel_sha256 }}
  PADDLEFLEET_OPS_WHEEL_URL: ${{ github.event.inputs.paddlefleet_ops_wheel_url }}
  PADDLEFLEET_OPS_WHEEL_SHA256: ${{ github.event.inputs.paddlefleet_ops_wheel_sha256 }}

defaults:
  run:
    shell: bash

jobs:
  alignment_model_accuracy:
    name: alignment_model_accuracy
    runs-on:
      group: h20-2c
    steps:
      - name: Determine the runner
        run: |
          runner_name=`(echo $PWD|awk -F '/' '{print $3}')`
          echo $runner_name
          wget -q https://xly-devops.bj.bcebos.com/utils.sh
          source utils.sh
          determine_gpu_runner ${runner_name}
      - name: Determine Image Name
        run: |
          echo "IMAGE_NAME=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda130-py312-dev" >> "$GITHUB_ENV"
      - name: Run Container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          docker run -d -t --name ${container_name} --net=host --gpus all --shm-size=32G \
            -v /dev/shm:/dev/shm \
            -v $work_dir/../../..:$work_dir/../../.. \
            -v $work_dir:/workspace \
            -v /home/.cache/pip:/home/.cache/pip \
            -v /ssd4/MODELDATA:/home/.cache \
            -e "BRANCH=$BRANCH" \
            -e "COMMIT_ID=$COMMIT_ID" \
            -e "PR_ID=$PR_ID" \
            -e "work_dir=$work_dir" \
            -e no_proxy \
            -e CE_name \
            -e python_version \
            -e ALIGNMENT_PADDLEFLEET_MODE \
            -e PADDLEFLEET_PIN_SHA \
            -e PADDLEFLEET_GIT_URL \
            -e PADDLEFLEET_WHEEL_URL \
            -e PADDLEFLEET_WHEEL_SHA256 \
            -e PADDLEFLEET_OPS_WHEEL_URL \
            -e PADDLEFLEET_OPS_WHEEL_SHA256 \
            -w /workspace $IMAGE_NAME
      - name: Checkout Code
        run: |
          docker exec -t $container_name /bin/bash -c '
            rm -rf * .[^.]*
            source $work_dir/../../../proxy
            if [ "${ALIGNMENT_PADDLEFLEET_MODE:-develop}" = "stack-paired" ]; then
              echo "stack-paired: skip CodeSync/develop PaddleFleet.tar; selector runs after python"
            else
              echo "Download PaddleFleet form https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddleFleet.tar"
              wget -q --no-proxy  https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddleFleet.tar --no-check-certificate
              rm -rf PaddleFleet && tar xf PaddleFleet.tar && rm -rf PaddleFleet.tar
              cd PaddleFleet && git pull && cd -
            fi

            echo "Download ms-swift form https://paddle-github-action.bj.bcebos.com/whl/ms-swift.tar.gz"
            wget -q --no-proxy https://paddle-github-action.bj.bcebos.com/whl/ms-swift.tar.gz --no-check-certificate
            rm -rf ms-swift && tar zxf ms-swift.tar.gz && rm -rf ms-swift.tar.gz
            cd ms-swift
            git config --global --add safe.directory /workspace/ms-swift
            git pull
            git submodule update --init --recursive --force
            git remote add upstream https://github.com/PFCCLab/ms-swift.git || true
            if [ -n "$PR_ID" ] && [ "$PR_ID" != "0" ]; then
              git fetch origin pull/${PR_ID}/head
              git checkout -B PR_${PR_ID} FETCH_HEAD
              echo "Checking out ${BRANCH}..."
              git fetch upstream ${BRANCH}:${BRANCH} || true
              git merge ${BRANCH} --no-edit || true
              git diff --numstat ${BRANCH} -- | awk "{print \$NF}"
            elif [ -n "$COMMIT_ID" ]; then
              echo "workflow_dispatch: checkout COMMIT_ID=${COMMIT_ID} (not BOS main)"
              git fetch --all --tags || true
              git fetch origin "$COMMIT_ID" || git fetch upstream "$COMMIT_ID" || true
              git checkout --force "$COMMIT_ID"
              git submodule update --init --recursive --force
            else
              echo "Not in a pull_request event and COMMIT_ID empty. Leaving tarball HEAD."
            fi
            echo "checked_out_head=$(git rev-parse HEAD)"
            test -z "$COMMIT_ID" || test "$(git rev-parse HEAD)" = "$COMMIT_ID"
            git log --pretty=oneline -10
          '
      - name: Change python version
        run: |
          docker exec -i -e "work_dir=$work_dir" -e "python_version=$python_version" $container_name /bin/bash <<-DOCKER_EOF
          echo "Change python version to $python_version"
          set -e
          source $work_dir/../../../proxy
          cp ${work_dir}/../../../Miniforge3-Linux-x86_64.sh /tmp/miniforge.sh
          bash /tmp/miniforge.sh -b -p /opt/conda
          /opt/conda/bin/conda create -n py_\$python_version python=\$python_version -y \
            --override-channels \
            -c conda-forge
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_\$python_version
          python --version
          DOCKER_EOF
      - name: Get Whl
        run: |
          docker exec -t $container_name /bin/bash -c '
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_$python_version
          python --version
          ldconfig

          BOS=https://paddle-github-action.bj.bcebos.com
          cd /workspace
          if [ "${ALIGNMENT_PADDLEFLEET_MODE:-develop}" = "stack-paired" ]; then
            echo "::group::Select stack-paired PaddleFleet (fail-closed SHA)"
            python -m pip install uv
            test -x /workspace/ms-swift/scripts/select_paddlefleet_alignment_pin.sh \
              || { echo "::error:: selector missing; checkout did not land COMMIT_ID"; exit 1; }
            bash /workspace/ms-swift/scripts/select_paddlefleet_alignment_pin.sh --dest /workspace
            cat /workspace/paddlefleet_alignment_pin_receipt.json
            test -f /workspace/paddlefleet_alignment_pin.env
            echo "::endgroup::"
            echo "::group::Download remaining wheels from BOS"
            for url in \
              $BOS/whl/megatron_core-0.0.0-cp312-cp312-linux_x86_64.whl \
              $BOS/whl/mcore_bridge-0.0.0-py3-none-any.whl ; do
              echo "Downloading $url"
              wget -q --no-proxy --no-check-certificate --tries=3 --timeout=60 "$url"
            done
            echo "::endgroup::"
          else
            echo "::group::Download paddlefleet / paddlefleet_ops / megatron-core / mcore-bridge wheels from BOS"
            for url in \
              $BOS/PaddleFleet/develop/latest/paddlefleet-0.0.0-py3-none-linux_x86_64.whl \
              $BOS/PaddleFleet/develop/latest/cu130/paddle-release/paddlefleet_ops-0.0.0-cp312-cp312-linux_x86_64.whl \
              $BOS/whl/megatron_core-0.0.0-cp312-cp312-linux_x86_64.whl \
              $BOS/whl/mcore_bridge-0.0.0-py3-none-any.whl ; do
              echo "Downloading $url"
              wget -q --no-proxy --no-check-certificate --tries=3 --timeout=60 "$url"
            done
            echo "::endgroup::"
          fi
          ls -l /workspace/

          echo "::group::Build ms-swift wheel"
          cd /workspace/ms-swift
          pip config set global.cache-dir "/home/.cache/pip"
          bash scripts/dependence/build.sh
          ls -l /workspace/upload/
          echo "::endgroup::"
          '
      - name: alignment_model_accuracy
        run: |
          docker exec -t $container_name /bin/bash -c '
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_$python_version
          python --version
          ldconfig

          source $work_dir/../../../proxy
          export PROXY_URL="${http_proxy}"
          bash /workspace/ms-swift/scripts/consume_paddlefleet_alignment_pin.sh \
            --env /workspace/paddlefleet_alignment_pin.env \
            --out /workspace/paddlefleet_alignment_pin.consumed.env
          set -a
          . /workspace/paddlefleet_alignment_pin.consumed.env
          set +a
          export MEGATRON_CORE_WHEEL_PATH=/workspace/megatron_core-0.0.0-cp312-cp312-linux_x86_64.whl
          export MS_SWIFT_WHEEL_PATH=/workspace/upload/ms_swift-0.0.0-py3-none-any.whl
          export MCORE_BRIDGE_WHEEL_PATH=/workspace/mcore_bridge-0.0.0-py3-none-any.whl
          # The BOS wheels are republished under a fixed 0.0.0 filename
          export UV_SKIP_WHEEL_FILENAME_CHECK=1

          for whl in "$PADDLEFLEET_WHEEL_PATH" "$PADDLEFLEET_OPS_WHEEL_PATH" \
            "$MS_SWIFT_WHEEL_PATH" "$MEGATRON_CORE_WHEEL_PATH" \
            "$MCORE_BRIDGE_WHEEL_PATH"; do
            [ -e "$whl" ] || { echo "::error:: missing wheel: $whl"; exit 1; }
            echo "using $whl"
          done
          python -m pip install uv
          bash PaddleFleet/scripts/alignment_model_accuracy/setup_venvs.sh
          bash -x PaddleFleet/scripts/alignment_model_accuracy/run_alignment_test.sh

          model_acc_align_exit_code=$?
          if [[ "$model_acc_align_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31m Model accuracy align failed.\033[0m"
            exit 1
          else
            echo -e "\033[32m Model accuracy align succeeded.\033[0m"
          fi
          '
      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f $container_name 2>/dev/null || true
